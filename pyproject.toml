[project]
name = "kelvin"
version = "1.0.0"
description = "KELVIN: harmonized MODIS + VIIRS burning activity calendar (NASA Space Apps 2026)"
requires-python = ">=3.11"

[project.scripts]
kelvin = "kelvin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["kelvin*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
